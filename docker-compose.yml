version: '3.8'

services:
  compiler_server:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: compiler_server
    environment:
      - RUST_LOG=debug
    ports:
      - "8080:8080"
    networks:
      - app-network
    command: /bin/bash -c "cd trabalho_sockets_rust && cargo run --release --bin compiler_server"
    restart: unless-stopped

  client_gui:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: client_gui
    depends_on:
      - compiler_server
    environment:
      - DISPLAY=${DISPLAY}
      - RUST_LOG=debug
    volumes:
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
      - ~/.Xauthority:/root/.Xauthority:rw
    networks:
      - app-network
    command: /bin/bash -c "cd trabalho_sockets_rust && cargo run --release --bin client_gui"
    restart: unless-stopped

networks:
  app-network:
    driver: bridge