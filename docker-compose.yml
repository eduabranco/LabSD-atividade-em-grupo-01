version: '3.8'

services:
  server:
    build:
      context: .
      dockerfile: server/Dockerfile
    container_name: rust_compiler_server
    ports:
      - "51482:51482"
    networks:
      - compiler-network
    environment:
      - PORT=51482
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "netstat", "-tuln", "|", "grep", "51482"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s

  client:
    build:
      context: .
      dockerfile: client/Dockerfile
    container_name: rust_compiler_client
    depends_on:
      server:
        condition: service_healthy
    networks:
      - compiler-network
    environment:
      - DISPLAY=${DISPLAY}
      - SERVER_HOST=server
      - SERVER_PORT=51482
    volumes:
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
      - ~/.Xauthority:/root/.Xauthority:rw
    restart: unless-stopped
    stdin_open: true
    tty: true

networks:
  compiler-network:
    driver: bridge